<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astik GatePass – Applicants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="adminapplicants.css" />
</head>
<body>
  <div class="layout">

    <aside class="sidebar">
      <div class="brand">
        <img src="https://www.adnu.edu.ph/wp-content/uploads/2014/03/AdNU-Seal-1.png"
             alt="Ateneo de Naga University seal" />
        <span>Astik GatePass</span>
      </div>

      <nav class="nav">
        <a href="admindashboard.html" class="nav-btn">Dashboard</a>
        <a href="adminapplicants.html" class="nav-btn active">Applicants</a>
        <a href="adminrecords.html" class="nav-btn">Records</a>
        <a href="#" class="nav-btn">Campus Parking</a>
      </nav>

      <a href="#" class="signout">Signout</a>
    </aside>

    <main class="main">
      <h1>Applicants</h1>

      <div class="search">
        <input type="text" placeholder="Search Applicants" aria-label="Search applicants" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </div>

      <section class="table-card">
        <div class="table-scroll">

          <div class="row head">
            <div class="cell">DATE/TIME</div>
            <div class="cell">NAME</div>
            <div class="cell">TYPE</div>
            <div class="cell">ACTION</div>
          </div>
          </div>
      </section>
    </main>

  </div>

  <script src="auth.js"></script>
  <script src="Applicants data.js"></script>
  <script>
    requireLogin();
    document.querySelector(".signout").addEventListener("click", (e) => {
      e.preventDefault();
      logout();
    });

    const tableScroll = document.querySelector(".table-scroll");
    const searchInput = document.querySelector(".search input");
    const decisions = getDecisions();

    function makeCell(text) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.textContent = text;
      return cell;
    }

    function makeButton(label, cls) {
      const btn = document.createElement("button");
      btn.className = "btn " + cls;
      btn.textContent = label;
      return btn;
    }

    function buildRow(id, applicant) {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.name = applicant.name.toLowerCase();

      const actions = document.createElement("div");
      actions.className = "actions";

      const approveBtn = makeButton("Approve", "approve");
      const rejectBtn = makeButton("Reject", "reject");
      const viewBtn = makeButton("View", "view");
      actions.append(approveBtn, rejectBtn, viewBtn);

      function lock() {
        approveBtn.disabled = true;
        rejectBtn.disabled = true;
      }

      if (decisions[id]) lock();

      approveBtn.addEventListener("click", () => {
        setDecision(id, "approved");
        lock();
      });
      rejectBtn.addEventListener("click", () => {
        setDecision(id, "rejected");
        lock();
      });
      viewBtn.addEventListener("click", () => {
        window.location.href = "adminapplicantdetails.html?id=" + id;
      });
            const typeLabel =
        applicant.affiliation.charAt(0) + applicant.affiliation.slice(1).toLowerCase();
            row.append(makeCell(applicant.appliedAt), makeCell(applicant.name), makeCell(typeLabel), actions);
      return row;
    }

    Object.keys(APPLICANTS).forEach((id) => {
      tableScroll.appendChild(buildRow(id, APPLICANTS[id]));
    });

    searchInput.addEventListener("input", () => {
      const query = searchInput.value.trim().toLowerCase();
      tableScroll.querySelectorAll(".row:not(.head)").forEach((row) => {
        row.style.display = row.dataset.name.includes(query) ? "" : "none";
      });
    });
  </script>
</body>
</html>
